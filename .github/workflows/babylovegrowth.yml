name: Import BabyLoveGrowth articles

# Checks BabyLoveGrowth once a day and opens one pull request per new article.
# Nothing is published until someone reviews the pull request and merges it.
# Run it by hand any time: Actions tab -> "Import BabyLoveGrowth articles" -> Run workflow.

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 9:17 am New York time (8:17 am in winter)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: babylovegrowth
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install nh3==0.2.18 markdown==3.7 beautifulsoup4==4.12.3

      - name: Import new articles as pull requests
        env:
          BABYLOVEGROWTH_API_KEY: ${{ secrets.BABYLOVEGROWTH_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "BabyLoveGrowth import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/babylovegrowth_sync.py
